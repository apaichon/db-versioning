name: Database Migration CI/CD

on:
  pull_request:
    paths:
      - 'migrations/**'
  push:
    branches:
      - main
    paths:
      - 'migrations/**'

jobs:
  # Job 1: Validate migrations on PR
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Find changed migration files
        id: changed
        run: |
          files=$(git diff --name-only origin/main HEAD -- migrations/V*.sql || true)
          echo "files=$files" >> $GITHUB_OUTPUT
          if [ -z "$files" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate SQL syntax
        if: steps.changed.outputs.has_changes == 'true'
        run: |
          for file in ${{ steps.changed.outputs.files }}; do
            echo "Validating: $file"
            # Check for basic SQL issues
            if grep -qi "DROP TABLE" "$file"; then
              echo "::error::DROP TABLE found in $file — requires manual review"
              exit 1
            fi
            if grep -qi "TRUNCATE" "$file"; then
              echo "::error::TRUNCATE found in $file — requires manual review"
              exit 1
            fi
            echo "✅ $file passed validation"
          done

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${status} Migration validation ${'${{ job.status }}'}`
            });

  # Job 2: Deploy to Test (auto on merge)
  deploy-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migrations on Test
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          for file in $(find migrations/ -name "V*.sql" | sort); do
            echo "Applying $file to app_test..."
            psql -h ${{ secrets.DB_HOST }} -p ${{ secrets.DB_PORT }} \
              -U ${{ secrets.DB_USER }} -d app_test \
              -v ON_ERROR_STOP=1 -f "$file"
            echo "✅ $file applied to test"
          done

  # Job 3: Deploy to UAT (manual approval)
  deploy-uat:
    needs: deploy-test
    runs-on: ubuntu-latest
    environment:
      name: uat
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migrations on UAT
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          for file in $(find migrations/ -name "V*.sql" | sort); do
            echo "Applying $file to app_uat..."
            psql -h ${{ secrets.DB_HOST }} -p ${{ secrets.DB_PORT }} \
              -U ${{ secrets.DB_USER }} -d app_uat \
              -v ON_ERROR_STOP=1 -f "$file"
            echo "✅ $file applied to uat"
          done

  # Job 4: Deploy to Prod (manual approval)
  deploy-prod:
    needs: deploy-uat
    runs-on: ubuntu-latest
    environment:
      name: prod
    steps:
      - uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run migrations on Prod
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          for file in $(find migrations/ -name "V*.sql" | sort); do
            echo "Applying $file to app_prod..."
            psql -h ${{ secrets.DB_HOST }} -p ${{ secrets.DB_PORT }} \
              -U ${{ secrets.DB_USER }} -d app_prod \
              -v ON_ERROR_STOP=1 -f "$file"
            echo "✅ $file applied to prod"
          done
