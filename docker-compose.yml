services:
  postgres:
    image: postgres:16-alpine
    container_name: db-versioning-postgres
    environment:
      POSTGRES_USER: tutorial
      POSTGRES_PASSWORD: tutorial_secret
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tutorial -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  bytebase:
    image: bytebase/bytebase:latest
    container_name: db-versioning-bytebase
    environment:
      PG_URL: postgres://tutorial:tutorial_secret@postgres:5432/app_db
    ports:
      - "8080:8080"
    volumes:
      - bytebase_data:/var/opt/bytebase
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  bytebase_data:
